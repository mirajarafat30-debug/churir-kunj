<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>চুড়ির কুঞ্জ — অনলাইন শপ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#fff8fb;color:#351d29}
header{background:linear-gradient(135deg,#761d4b,#d15b8c);color:#fff;padding:14px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:800}.cart{border:0;border-radius:24px;padding:10px 16px;color:#761d4b;font-weight:bold}
.hero{text-align:center;padding:58px 7%;background:linear-gradient(#ffe1ed,#fff8fb)}.hero h1{font-size:42px;margin:8px}.hero p{font-size:18px}.btn{border:0;border-radius:25px;padding:11px 18px;background:#9c2f62;color:#fff;font-weight:bold;cursor:pointer}
section{padding:30px 7%}h2{text-align:center}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:18px;max-width:1100px;margin:auto}.card{background:#fff;padding:14px;border-radius:18px;box-shadow:0 5px 18px #0001}.photo{width:100%;height:210px;object-fit:cover;border-radius:14px;background:#f7c5d8}.name{font-weight:bold;font-size:18px;margin:12px 0 5px}.price{color:#a12660;font-weight:800;margin-bottom:12px}.panel,.order{max-width:700px;margin:auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 5px 18px #0001}.panel input,.order input,.order textarea,.order select{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #e2c8d3;border-radius:10px}.hidden{display:none}footer{background:#351b29;color:#fff;text-align:center;padding:25px;margin-top:20px}#toast{position:fixed;bottom:20px;right:20px;background:#351b29;color:#fff;padding:13px 17px;border-radius:12px;display:none}
</style></head>
<body>
<header><div class="logo">💖 চুড়ির কুঞ্জ</div><button class="cart" onclick="openCart()">🛒 কার্ট (<span id="count">0</span>)</button></header>
<div class="hero"><h1>চুড়ির কুঞ্জ</h1><p>রঙিন চুড়ির ঝংকারে সাজুক প্রতিটি মুহূর্ত ✨</p><button class="btn" onclick="document.getElementById('shop').scrollIntoView()">🛍️ শপিং শুরু করুন</button></div>
<section id="shop"><h2>✨ আমাদের পণ্য ✨</h2><div class="products" id="products"></div></section>
<section><div class="panel"><h2>➕ নতুন পণ্য যোগ করুন</h2><p>ছবি, নাম ও দাম দিয়ে তোমার পণ্য যোগ করো।</p><input id="photo" type="file" accept="image/*"><input id="pname" placeholder="পণ্যের নাম"><input id="price" type="number" placeholder="দাম (৳)"><button class="btn" onclick="addProduct()">পণ্য যোগ করুন</button></div></section>
<section id="orderSection" class="hidden"><div class="order"><h2>📦 অর্ডার করুন</h2><p id="selected"></p><input id="customer" placeholder="আপনার নাম"><input id="phone" placeholder="মোবাইল নম্বর"><textarea id="address" rows="3" placeholder="সম্পূর্ণ ঠিকানা"></textarea><input id="qty" type="number" min="1" value="1"><select id="payment"><option>ক্যাশ অন ডেলিভারি</option><option>অনলাইন পেমেন্ট</option></select><button class="btn" onclick="placeOrder()">অর্ডার কনফার্ম করুন</button></div></section>
<footer>© 2026 চুড়ির কুঞ্জ • সৌন্দর্যের এক ঠিকানা 💕</footer><div id="toast"></div>
<script>
let products=JSON.parse(localStorage.getItem('ck_products')||'null')||[{name:'গোলাপি চুড়ি সেট',price:350,img:''},{name:'পার্পল চুড়ি সেট',price:400,img:''},{name:'সবুজ চুড়ি সেট',price:300,img:''}],cart=[];
function save(){localStorage.setItem('ck_products',JSON.stringify(products))}
function render(){let b=document.getElementById('products');b.innerHTML='';products.forEach((p,i)=>{let c=document.createElement('div');c.className='card';c.innerHTML=(p.img?`<img class="photo" src="${p.img}">`:`<div class="photo" style="display:flex;align-items:center;justify-content:center;font-size:65px">💍</div>`)+`<div class="name">${p.name}</div><div class="price">৳ ${p.price}</div><button class="btn" onclick="buy(${i})">অর্ডার করুন</button> <button class="btn" onclick="addCart(${i})">কার্টে রাখুন</button>`;b.appendChild(c)})}
function addCart(i){cart.push(products[i]);document.getElementById('count').textContent=cart.length;toast('কার্টে যোগ হয়েছে 💕')}
function buy(i){cart=[products[i]];document.getElementById('count').textContent=1;document.getElementById('selected').textContent='পণ্য: '+products[i].name+' — ৳ '+products[i].price;document.getElementById('orderSection').classList.remove('hidden');document.getElementById('orderSection').scrollIntoView({behavior:'smooth'})}
function openCart(){if(!cart.length)return toast('কার্ট খালি 🛒');buy(products.indexOf(cart[0]))}
function addProduct(){let f=document.getElementById('photo').files[0],n=document.getElementById('pname').value.trim(),p=document.getElementById('price').value;if(!n||!p)return toast('পণ্যের নাম ও দাম দিন');let done=img=>{products.push({name:n,price:Number(p),img:img||''});save();render();document.getElementById('pname').value='';document.getElementById('price').value='';document.getElementById('photo').value='';toast('পণ্য যোগ হয়েছে ✅')};if(f){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done('')}
function placeOrder(){let n=document.getElementById('customer').value.trim(),ph=document.getElementById('phone').value.trim(),ad=document.getElementById('address').value.trim();if(!n||!ph||!ad)return toast('নাম, মোবাইল ও ঠিকানা পূরণ করুন');let p=cart[0],q=document.getElementById('qty').value;alert('অর্ডার গ্রহণ করা হয়েছে!\n\nনাম: '+n+'\nপণ্য: '+p.name+'\nপরিমাণ: '+q+'\nমোবাইল: '+ph);toast('অর্ডার সফল হয়েছে 🎉')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}render();
</script></body></html>
